name: Pruebas

on:
  push:
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 17: la versión de producción (Dockerfile). 25: la que usan los equipos de desarrollo.
        java: ['17', '25']
    defaults:
      run:
        working-directory: gestion_curricular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compilar y correr las pruebas
        run: ./mvnw -B -ntp verify

      - name: Guardar los reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-java-${{ matrix.java }}
          path: gestion_curricular/target/surefire-reports/
          retention-days: 7
