# Configuración general de la aplicación
spring.application.name=gestion_curricular
server.port=${PORT:8080}

# Perfil activo por defecto (sobrescribible con variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Ubicación explícita de archivos de configuración
spring.config.location=classpath:/application.properties,classpath:/application-${SPRING_PROFILES_ACTIVE:dev}.properties

# Configuración de codificación UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Detrás del proxy del hosting, la IP del cliente sale de X-Forwarded-For solo si la agregó un proxy
# interno; así nadie puede inventarse una IP para saltarse el límite de intentos de login
server.forward-headers-strategy=native

# Inicio de sesión con Google: Client ID de tipo "Aplicación web" creado en Google Cloud Console.
# Si queda vacío, el inicio con Google responde 503 y el resto de la aplicación funciona igual.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# Solo se aceptan cuentas de este dominio de Google Workspace
app.google.dominio=${GOOGLE_DOMINIO:unicauca.edu.co}

# JPA: cargar relaciones perezosas en lotes (evita una consulta por fila, problema N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Configuración de SpringDoc OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=co.edu.unicauca.decanatura.gestion_curricular.infraestructura.input.controladores
springdoc.show-actuator=false

# Configuración OpenAPI
app.openapi.dev-url=http://localhost:${server.port}