# Mensajes de las validaciones de los DTO de petición (Bean Validation).
# {min}, {max} y {value} los completa el validador con los valores de cada anotación,
# así el mensaje no se desfasa si cambia la regla.

# Usuario
Usuario.nombre_completo.empty=El nombre está vacío
Usuario.nombre_completo.length=El nombre debe tener entre {min} y {max} caracteres
Usuario.codigo.empty=El código del estudiante no puede estar vacío
Usuario.codigo.length=El código del estudiante debe tener entre {min} y {max} caracteres
Usuario.cedula.length=La cédula debe tener entre {min} y {max} caracteres
Usuario.cedula.format=La cédula debe contener solo números
Usuario.correo.empty=El correo electrónico no puede estar vacío
Usuario.correo.length=El correo electrónico debe tener entre {min} y {max} caracteres
Usuario.correo.unicauca=El correo debe ser @unicauca.edu.co
Usuario.rol.notnull=El rol es obligatorio
Usuario.rol.min=Debe seleccionar un rol válido
Usuario.programa.min=Debe seleccionar un programa válido
Usuario.objPrograma.notnull=El programa no puede estar vacío

# Inicio de sesión
Login.correo.empty=El correo no puede estar vacío.
Login.correo.length=El correo debe tener entre {min} y {max} caracteres.
Login.password.empty=La contraseña no puede estar vacía.
LoginGoogle.credencial.empty=Falta la credencial de Google.

# Docente
Docente.codigo.empty=El código del docente no puede estar vacío
Docente.codigo.length=El código del docente debe tener entre {min} y {max} caracteres
Docente.nombre.empty=El nombre del docente no puede estar vacío
Docente.nombre.length=El nombre del docente debe tener entre {min} y {max} caracteres

# Programa
Programa.codigo.empty=El código del programa no puede estar vacío
Programa.codigo.length=El código del programa debe tener entre {min} y {max} caracteres
Programa.nombre.empty=El nombre del programa no puede estar vacío
Programa.nombre.length=El nombre del programa debe tener entre {min} y {max} caracteres

# Rol
Rol.nombre.empty=El nombre del rol no puede estar vacío.
Rol.nombre.length=El nombre del rol debe tener entre {min} y {max} caracteres.

# Documento
Documento.nombre.empty=El nombre del documento no puede estar vacío
Documento.nombre.length=El nombre del documento debe tener entre {min} y {max} caracteres
Documento.ruta.empty=La ruta del documento no puede estar vacía
Documento.ruta.length=La ruta del documento debe tener entre {min} y {max} caracteres
Documento.fecha.empty=La fecha del documento no puede estar vacía
Documento.fecha.pastorpresent=La fecha del documento debe ser pasada o actual
Documento.comentario.empty=El comentario no puede estar vacío
Documento.comentario.length=El comentario debe tener entre {min} y {max} caracteres

# Solicitud
Solicitud.nombre.empty=El nombre de la solicitud no puede estar vacío
Solicitud.nombre.length=El nombre de la solicitud debe tener entre {min} y {max} caracteres
Solicitud.fecha.empty=La fecha de registro no puede estar vacía
Solicitud.fecha.pastorpresent=La fecha de registro debe ser pasada o actual
Solicitud.fecha_ceremonia.pastorpresent=La fecha de la ceremonia debe ser pasada o actual
Solicitud.estado.empty=El estado actual no puede estar vacío
Solicitud.estado.length=El estado actual debe tener entre {min} y {max} caracteres
Solicitud.usuario.empty=Debe asociar un usuario a la solicitud
Solicitud.periodo_academico.format=El período académico debe tener el formato YYYY-P (ej: 2024-2)

# Estado de una solicitud
EstadoSolicitud.estado_actual.empty=El estado actual no puede estar vacío.
EstadoSolicitud.estado_actual.length=El estado actual debe tener entre {min} y {max} caracteres.
EstadoSolicitud.fecha_registro_estado.empty=La fecha de registro del estado es obligatoria.

# Homologación
SolicitudHomologacion.programa_origen.length=El programa de origen no puede tener más de {max} caracteres
SolicitudHomologacion.programa_destino.length=El programa de destino no puede tener más de {max} caracteres

# ECAES
SolicitudEcaes.tipoDocumento.empty=El tipo de documento no puede estar vacío
SolicitudEcaes.tipoDocumento.length=El tipo de documento debe tener entre {min} y {max} caracteres
SolicitudEcaes.numeroDocumento.empty=El número de documento no puede estar vacío
SolicitudEcaes.numeroDocumento.length=El número de documento debe tener entre {min} y {max} caracteres
SolicitudEcaes.fechaExpedicion.empty=La fecha de expedición no puede estar vacía
SolicitudEcaes.fechaExpedicion.pastorpresent=La fecha de expedición debe ser pasada o actual
SolicitudEcaes.fechaNacimiento.empty=La fecha de nacimiento no puede estar vacía
SolicitudEcaes.fechaNacimiento.pastorpresent=La fecha de nacimiento debe ser pasada o actual
